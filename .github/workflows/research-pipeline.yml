name: Daily Research Pipeline

on:
  workflow_dispatch:
  schedule:
    # 06:00 Beijing time (22:00 UTC, previous day)
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:
  build-research-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Restore research radar state
        run: |
          git fetch origin state || true
          mkdir -p state
          if git rev-parse --verify origin/state >/dev/null 2>&1; then
            git checkout origin/state -- state || true
          fi
          if [ -d state/state ]; then
            cp -R state/state/. state/
            rm -rf state/state
          fi

      - name: Run daily research file pipeline
        env:
          PYTHONUNBUFFERED: "1"
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          WECHAT_PUSH_PROVIDER: ${{ vars.WECHAT_PUSH_PROVIDER }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
          OPENAI_API_TIMEOUT: ${{ vars.OPENAI_API_TIMEOUT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_API_BASE: ${{ vars.DASHSCOPE_API_BASE }}
          DASHSCOPE_API_TIMEOUT: ${{ vars.DASHSCOPE_API_TIMEOUT }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          ARXIV_KEYWORDS: ${{ vars.ARXIV_KEYWORDS }}
          ARXIV_DOMAIN_KEYWORDS: ${{ vars.ARXIV_DOMAIN_KEYWORDS }}
          ARXIV_METHOD_KEYWORDS: ${{ vars.ARXIV_METHOD_KEYWORDS }}
          ARXIV_TASK_KEYWORDS: ${{ vars.ARXIV_TASK_KEYWORDS }}
          ARXIV_KEYWORD_QUERY_MAX_RESULTS: ${{ vars.ARXIV_KEYWORD_QUERY_MAX_RESULTS }}
          ARXIV_RETRIEVAL_RESULT_LIMIT: ${{ vars.ARXIV_RETRIEVAL_RESULT_LIMIT }}
          ARXIV_FRESHNESS_HOURS: ${{ vars.ARXIV_FRESHNESS_HOURS }}
          ARXIV_FRESHNESS_FALLBACK_HOURS: ${{ vars.ARXIV_FRESHNESS_FALLBACK_HOURS }}
          ARXIV_FRESHNESS_MONTH_HOURS: ${{ vars.ARXIV_FRESHNESS_MONTH_HOURS }}
          ARXIV_RETRIEVAL_BACKFILL_HOURS: ${{ vars.ARXIV_RETRIEVAL_BACKFILL_HOURS }}
          ARXIV_STRICT_RSS_FIRST: ${{ vars.ARXIV_STRICT_RSS_FIRST }}
          ARXIV_STRICT_HTML_FALLBACK_ENABLED: ${{ vars.ARXIV_STRICT_HTML_FALLBACK_ENABLED }}
          ARXIV_HTML_FALLBACK_RESULT_LIMIT: ${{ vars.ARXIV_HTML_FALLBACK_RESULT_LIMIT }}
          ARXIV_KEYWORD_FALLBACK_TO_RSS: ${{ vars.ARXIV_KEYWORD_FALLBACK_TO_RSS }}
          ARXIV_INCLUDE_CROSS_LIST: ${{ vars.ARXIV_INCLUDE_CROSS_LIST }}
          ARXIV_USE_RSS_METADATA: ${{ vars.ARXIV_USE_RSS_METADATA }}
          ARXIV_EXTRACT_FULL_TEXT: ${{ vars.ARXIV_EXTRACT_FULL_TEXT }}
          MAX_CANDIDATE_NUM: ${{ vars.MAX_CANDIDATE_NUM }}
          DAILY_PIPELINE_MODE: ${{ vars.DAILY_PIPELINE_MODE }}
          DAILY_PIPELINE_STATE_PATH: ${{ vars.DAILY_PIPELINE_STATE_PATH }}
          DAILY_PIPELINE_CANDIDATE_COUNT: ${{ vars.DAILY_PIPELINE_CANDIDATE_COUNT }}
          DAILY_PIPELINE_TOP20_COUNT: ${{ vars.DAILY_PIPELINE_TOP20_COUNT }}
          DAILY_PIPELINE_SELECTED_COUNT: ${{ vars.DAILY_PIPELINE_SELECTED_COUNT }}
          DAILY_PIPELINE_LLM_RERANK_COUNT: ${{ vars.DAILY_PIPELINE_LLM_RERANK_COUNT }}
          DAILY_PIPELINE_LLM_SELECTION_BATCH_SIZE: ${{ vars.DAILY_PIPELINE_LLM_SELECTION_BATCH_SIZE }}
          DAILY_PIPELINE_LLM_SELECTION_ENABLED: ${{ vars.DAILY_PIPELINE_LLM_SELECTION_ENABLED }}
          DAILY_PIPELINE_RETRIEVAL_ONLY: ${{ vars.DAILY_PIPELINE_RETRIEVAL_ONLY }}
          DAILY_PIPELINE_SELECTION_ONLY: ${{ vars.DAILY_PIPELINE_SELECTION_ONLY }}
          DAILY_PIPELINE_CARD_MODE: ${{ vars.DAILY_PIPELINE_CARD_MODE }}
          DAILY_PIPELINE_FULL_CARD_INPUT_CHARS: ${{ vars.DAILY_PIPELINE_FULL_CARD_INPUT_CHARS }}
          DAILY_PIPELINE_FULL_CARD_OUTPUT_TOKENS: ${{ vars.DAILY_PIPELINE_FULL_CARD_OUTPUT_TOKENS }}
          DAILY_PIPELINE_QUICK_LOOK_INPUT_CHARS: ${{ vars.DAILY_PIPELINE_QUICK_LOOK_INPUT_CHARS }}
          DAILY_PIPELINE_QUICK_LOOK_OUTPUT_TOKENS: ${{ vars.DAILY_PIPELINE_QUICK_LOOK_OUTPUT_TOKENS }}
          DAILY_PIPELINE_THREE_CARD_DIGEST_INPUT_CHARS: ${{ vars.DAILY_PIPELINE_THREE_CARD_DIGEST_INPUT_CHARS }}
          DAILY_PIPELINE_THREE_CARD_DIGEST_OUTPUT_TOKENS: ${{ vars.DAILY_PIPELINE_THREE_CARD_DIGEST_OUTPUT_TOKENS }}
          DAILY_QUOTE_ENABLED: ${{ vars.DAILY_QUOTE_ENABLED }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          fi
          uv run src/zotero_arxiv_daily/research_pipeline_main.py

      - name: Upload daily research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-pipeline
          path: outputs/daily/**
          if-no-files-found: ignore

      - name: Persist research radar state
        if: always()
        run: |
          if [ ! -d state ]; then
            exit 0
          fi
          tmpdir="$(mktemp -d)"
          cp -R state "$tmpdir/state"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan state-work
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$tmpdir/state" ./state
          if [ -d state/state ]; then
            cp -R state/state/. state/
            rm -rf state/state
          fi
          git add state
          git commit -m "Update research radar state" || exit 0
          git push origin HEAD:state --force
