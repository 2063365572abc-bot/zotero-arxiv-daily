<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>每日科研雷达</title><style>+:root{color-scheme:light;--ink:#172e2b;--muted:#526a65;--accent:#126450;--line:#d8e3dc}
*{box-sizing:border-box}body{margin:0;background:#f4f6f1;color:var(--ink);font:16px/1.75 system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
main{max-width:820px;margin:auto;padding:32px 18px 70px}a{color:var(--accent);overflow-wrap:anywhere}h1{font-size:30px;line-height:1.3;margin:12px 0}h2{font-size:21px;line-height:1.45}p{margin:12px 0}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--accent)}
.muted,small{color:var(--muted)}.paper{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:22px 0}.tag{font-size:12px;background:#e9f1e9;border-radius:99px;padding:4px 10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.button{display:inline-flex;align-items:center;min-height:46px;padding:9px 14px;border:1px solid var(--line);border-radius:9px;text-decoration:none;background:#fff}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
summary{cursor:pointer;color:var(--accent);padding:8px 0}details{border-top:1px solid var(--line);margin-top:14px}details h1,details h2,details h3{font-size:16px}details ul{padding-left:22px}footer{margin-top:36px;font-size:13px;color:var(--muted)}.archive{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}header{border-bottom:1px solid var(--line);padding-bottom:24px}img{max-width:100%}table{display:block;overflow:auto;max-width:100%}th,td{padding:6px;border:1px solid var(--line)}
@media(max-width:480px){main{padding-top:24px}.paper{padding:18px}h1{font-size:26px}.actions .button{flex:1 1 42%;justify-content:center;text-align:center}}
</style></head><body><main><h1>每日科研雷达</h1><p><a class="button primary" href="daily/index.html">进入每日更新</a></p></main></body></html>
