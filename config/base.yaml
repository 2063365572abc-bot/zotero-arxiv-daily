zotero:
  user_id: ??? # User ID of your Zotero account.
  api_key: ??? # An Zotero API key with read access.
  include_path: null # A list of glob patterns marking the Zotero collections that should be included. Example: ["2026/survey/**","2026/reading-group/**"]
  ignore_path: null # A list of glob patterns marking the Zotero collections that should be excluded. Example: ["2026/ignore/**","archive/**"]

source:
  arxiv:
    category: null # The categories of target arxiv papers. Find the abbr of your research area from [here](https://arxiv.org/category_taxonomy). Example: ["cs.AI","cs.CV","cs.LG","cs.CL"]
    keywords: null # Optional keyword phrases for arXiv API search over title/abstract/full metadata. Example: ["single-cell foundation model","spatial transcriptomics"]
    domain_keywords: null # Optional soft biology-domain phrases used for candidate metadata and later ranking. Example: ["spatial transcriptomics", "spatially resolved transcriptomics"]
    method_keywords: null # Optional soft machine-learning phrases used for candidate metadata and later ranking. Example: ["machine learning", "deep learning", "graph neural network"]
    task_keywords: null # Optional task phrases used for deterministic retrieval scoring. Example: ["spatial domain", "cellular neighborhood"]
    keyword_query_max_results: 100 # Maximum recent arXiv category results fetched before downstream ranking. Example: 100
    retrieval_result_limit: 50 # Maximum recent candidates returned by the retriever. Example: 50
    freshness_hours: 48 # Primary age window for first submissions. Example: 48
    freshness_fallback_hours: 168 # Optional wider window used only when the primary window is sparse. Example: 168
    freshness_month_hours: 720 # Wider recent window used before reporting a sparse daily candidate pool. Example: 720
    retrieval_backfill_hours: 17520 # Legacy historical search window; daily radar should not use it to fill recent candidates. Example: 17520
    strict_rss_first: true # Legacy option; recent category API is preferred for daily radar candidates. Example: true
    strict_html_fallback_enabled: true # Legacy option; historical HTML search is not used to fill daily radar candidates. Example: true
    html_fallback_result_limit: 50 # Maximum HTML search results inspected for local filtering. Example: 50
    keyword_fallback_to_rss: true # When arXiv search API is rate-limited, pull category RSS and filter by keywords locally. Example: true
    include_cross_list: true # Whether to include arXiv cross-list papers in subscribed categories. Example: true
    use_rss_metadata: true # Whether to use RSS title/abstract metadata instead of slower arXiv API detail calls. Example: true
    extract_full_text: false # Whether to download and extract arXiv source/html/pdf text. This is slower. Example: true
  biorxiv:
    category: null # The categories of target biorxiv papers. Find categories from [here](https://www.biorxiv.org/). Example: ["biochemistry","animal behavior and cognition"]
  medrxiv:
    category: null # The categories of target medrxiv papers. Find categories from [here](https://www.medrxiv.org/) Example: ["psychiatry and clinical psychology", "neurology"]
  chemrxiv:
    include_new_versions: false # Whether to include revised versions (v2, v3, ...) of previously posted chemrxiv preprints in addition to new first postings. chemrxiv has no category filter: all new preprints (a few dozen per day) are retrieved via Crossref and left to the reranker. Example: true

email:
  sender: ??? # The email account of the SMTP server that sends you email. Example: abc@qq.com
  receiver: ??? # The email account that receives the paper list. Example: abc@outlook.com
  smtp_server: ??? # The SMTP server that sends the email. Ask your email provider (Gmail, QQ, Outlook, ...) for its SMTP server. Example: smtp.qq.com
  smtp_port: ??? # The port of SMTP server. Example: 465
  sender_password: ??? # The password of the sender account. Note that it's not necessarily the password for logging in the e-mail client, but the authentication code for SMTP service. Ask your email provider for this. Example: abcdefghijklmn

report:
  output_dir: outputs/reports # Local directory for generated digest artifacts.

daily_pipeline:
  output_dir: outputs/daily # Local directory for full daily research artifacts.
  mode: full_research_radar # Pipeline mode. Options: full_research_radar, legacy, selection_only fallback flags.
  state_path: state/research_radar.sqlite # Persistent SQLite state restored by GitHub Actions.
  candidate_count: 50 # Maximum candidate papers kept before embedding rerank.
  top20_count: 20 # Number of embedding-ranked papers sent to the LLM.
  selected_count: 3 # Number of papers selected for PDF/Card processing.
  llm_rerank_count: 20 # Number of title/abstract candidates sent to the LLM for scientific-value scoring.
  llm_selection_batch_size: 10 # Number of candidates per LLM selection request.
  llm_selection_enabled: true # Whether Qwen performs the second-stage title/abstract selection.
  card_mode: brief # Card generation mode. Options: brief or one_shot_full.
  selection_only: false # Stop after Qwen title/abstract selection without downloading PDFs or generating cards.
  retrieval_only: false # Stop after candidate retrieval without model calls.
  full_card_input_chars: 55000 # Maximum extracted PDF characters sent to one-shot full-card generation.
  full_card_output_tokens: 12000 # Maximum output tokens for one-shot full-card generation.

daily_radar:
  quote_enabled: true # Whether to fetch a daily quote before falling back to local warm lines. Example: true

llm:
  api:
    key: ??? # API Key of your LLM API. Example: sk-xxx
    base_url: ??? # API URL of your LLM API. Example: https://api.openai.com/v1
    timeout: 60 # Request timeout in seconds. Example: 60
  api_mode: chat_completion # The LLM API to use. Options: chat_completion or response.
  generation_kwargs:
  # Arguments for the selected LLM API.
    max_tokens: 16384
    model: ???
  language: English # Preferred language for the TL;DR. Example: English
  research_profile: "" # Personal research interests used by the structured research brief prompt.

reranker:
  local:
    model: jinaai/jina-embeddings-v5-text-nano-retrieval # The Hugging Face model name of the local embedding model. Example: jinaai/jina-embeddings-v5-text-nano
    encode_kwargs:
    # The kwargs for the encode method of the local embedding model. Details see [here](https://www.sbert.net/docs/package_reference/SentenceTransformer.html#sentence_transformers.SentenceTransformer.encode)
      task: retrieval
      prompt_name: document
  api:
    key: null # API Key of your embedding model API. Example: sk-xxx
    base_url: null # API URL of your embedding model API. Example: https://api.openai.com/v1
    model: text-embedding-v4 # The model name of the embedding model. Example: text-embedding-v4
    batch_size: null # The batch size for embedding API requests. Adjust to match your provider's limit. Example: 64
    timeout: 60 # Request timeout in seconds. Example: 60

executor:
  debug: false # Whether to use debug mode. Example: true
  debug_paper_limit: 10 # Maximum papers per source in debug mode. Example: 2
  max_candidate_num: null # Maximum raw candidates converted per source before reranking. Example: 20
  send_empty: false # Whether to send an empty email even if no new papers today. Example: true
  max_paper_num: 100 # The maximum number of the papers presented in the email. Example: 100
  source: ??? # The sources of papers to retrieve. Example: ['arxiv','biorxiv','medrxiv','chemrxiv']
  reranker: local # The reranker to use. Example: 'local' or 'api'
