zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null # Or set a list of glob patterns, e.g. ["2026/survey/**","2026/reading-group/**"]

email:
  enabled: ${oc.env:EMAIL_ENABLED,true}
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD}

notification:
  wechat:
    provider: ${oc.env:WECHAT_PUSH_PROVIDER,null} # serverchan, pushplus, or wecom
    serverchan_send_key: ${oc.env:SERVERCHAN_SENDKEY,null}
    pushplus_token: ${oc.env:PUSHPLUS_TOKEN,null}
    wecom_webhook: ${oc.env:WECOM_WEBHOOK,null}

report:
  output_dir: ${oc.env:REPORT_OUTPUT_DIR,outputs/reports}

daily_pipeline:
  output_dir: ${oc.env:DAILY_PIPELINE_OUTPUT_DIR,outputs/daily}
  mode: ${oc.env:DAILY_PIPELINE_MODE,full_research_radar}
  state_path: ${oc.env:DAILY_PIPELINE_STATE_PATH,state/research_radar.sqlite}
  candidate_count: ${oc.env:DAILY_PIPELINE_CANDIDATE_COUNT,50}
  top20_count: ${oc.env:DAILY_PIPELINE_TOP20_COUNT,20}
  selected_count: ${oc.env:DAILY_PIPELINE_SELECTED_COUNT,3}
  llm_rerank_count: ${oc.env:DAILY_PIPELINE_LLM_RERANK_COUNT,20}
  llm_selection_batch_size: ${oc.env:DAILY_PIPELINE_LLM_SELECTION_BATCH_SIZE,10}
  llm_selection_enabled: ${oc.env:DAILY_PIPELINE_LLM_SELECTION_ENABLED,true}
  retrieval_only: ${oc.env:DAILY_PIPELINE_RETRIEVAL_ONLY,false}
  selection_only: ${oc.env:DAILY_PIPELINE_SELECTION_ONLY,false}
  card_mode: ${oc.env:DAILY_PIPELINE_CARD_MODE,one_shot_full}
  full_card_input_chars: ${oc.env:DAILY_PIPELINE_FULL_CARD_INPUT_CHARS,160000}
  full_card_output_tokens: ${oc.env:DAILY_PIPELINE_FULL_CARD_OUTPUT_TOKENS,16000}
  three_card_digest_input_chars: ${oc.env:DAILY_PIPELINE_THREE_CARD_DIGEST_INPUT_CHARS,180000}
  three_card_digest_output_tokens: ${oc.env:DAILY_PIPELINE_THREE_CARD_DIGEST_OUTPUT_TOKENS,5000}

daily_radar:
  quote_enabled: ${oc.env:DAILY_QUOTE_ENABLED,true}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
    timeout: ${oc.env:OPENAI_API_TIMEOUT,900}
  api_mode: chat_completion
  generation_kwargs:
    model: ${oc.env:LLM_MODEL,qwen3.8-max}
    max_tokens: 700
  language: Chinese
  research_profile: >
    用户关注 single-cell foundation models、spatial transcriptomics、graph neural networks、
    multi-omics、biomedical AI、perturbation prediction、cell state representation、
    domain segmentation、cross-modal alignment，以及这些方向如何形成可验证的新科研 idea。

source:
  arxiv:
    category: [
      "q-bio.GN","q-bio.QM","q-bio.CB","q-bio.TO","cs.LG","cs.CV","cs.AI","stat.ML"
    ]
    keywords: ${oc.decode:${oc.env:ARXIV_KEYWORDS,null}}
    domain_keywords: ${oc.decode:${oc.env:ARXIV_DOMAIN_KEYWORDS,["spatial transcriptomics","spatially resolved transcriptomics","spatial omics","spatial gene expression","spatial transcriptomic","spatial molecular","spatial multi-omics","spatial proteomics"]}}
    method_keywords: ${oc.decode:${oc.env:ARXIV_METHOD_KEYWORDS,["machine learning","deep learning","representation learning","foundation model","graph neural network","graph transformer","self-supervised learning","contrastive learning","transformer","neural network","embedding","generative model","diffusion model","variational autoencoder"]}}
    task_keywords: ${oc.decode:${oc.env:ARXIV_TASK_KEYWORDS,["spatial domain","cellular neighborhood","cell-cell communication","spatially variable genes","deconvolution","cell type annotation","tissue architecture","spatial multi-omics"]}}
    keyword_query_max_results: ${oc.env:ARXIV_KEYWORD_QUERY_MAX_RESULTS,100}
    retrieval_result_limit: ${oc.env:ARXIV_RETRIEVAL_RESULT_LIMIT,50}
    freshness_hours: ${oc.env:ARXIV_FRESHNESS_HOURS,48}
    freshness_fallback_hours: ${oc.env:ARXIV_FRESHNESS_FALLBACK_HOURS,168}
    freshness_month_hours: ${oc.env:ARXIV_FRESHNESS_MONTH_HOURS,720}
    retrieval_backfill_hours: ${oc.env:ARXIV_RETRIEVAL_BACKFILL_HOURS,17520}
    strict_rss_first: ${oc.env:ARXIV_STRICT_RSS_FIRST,true}
    strict_html_fallback_enabled: ${oc.env:ARXIV_STRICT_HTML_FALLBACK_ENABLED,true}
    html_fallback_result_limit: ${oc.env:ARXIV_HTML_FALLBACK_RESULT_LIMIT,200}
    keyword_fallback_to_rss: ${oc.env:ARXIV_KEYWORD_FALLBACK_TO_RSS,true}
    include_cross_list: ${oc.env:ARXIV_INCLUDE_CROSS_LIST,true}
    use_rss_metadata: ${oc.env:ARXIV_USE_RSS_METADATA,true}
    extract_full_text: ${oc.env:ARXIV_EXTRACT_FULL_TEXT,false}
  biorxiv:
    category: [
      "animal behavior and cognition","bioengineering","bioinformatics","biophysics",
      "cancer biology","cell biology","developmental biology","ecology",
      "evolutionary biology","genetics","genomics","immunology","microbiology",
      "molecular biology","neuroscience","pharmacology and toxicology",
      "physiology","plant biology","systems biology"
    ]
  medrxiv:
    category: [
      "allergy and immunology","cardiovascular medicine","endocrinology",
      "epidemiology","genetic and genomic medicine","health informatics",
      "health policy","infectious diseases","neurology","oncology",
      "psychiatry and clinical psychology","public and global health",
      "radiology and imaging"
    ]
  chemrxiv:
    include_new_versions: false

reranker:
  api:
    key: ${oc.env:DASHSCOPE_API_KEY}
    base_url: ${oc.env:DASHSCOPE_API_BASE,https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${oc.env:EMBEDDING_MODEL,text-embedding-v4}
    batch_size: 10
    timeout: ${oc.env:DASHSCOPE_API_TIMEOUT,60}

executor:
  debug: ${oc.env:DEBUG,null}
  debug_paper_limit: ${oc.env:DEBUG_PAPER_LIMIT,10}
  max_candidate_num: ${oc.env:MAX_CANDIDATE_NUM,20}
  max_paper_num: ${oc.env:MAX_PAPER_NUM,3}
  source: ['arxiv']
  reranker: api
